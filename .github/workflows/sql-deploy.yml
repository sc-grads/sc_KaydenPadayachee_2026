name: Deploy Local SQL
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
 
  # -----------------------
  # LOCAL DEPLOYMENT (NO APPROVAL)
  # -----------------------
  deploy-local:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
 
      - name: Execute SQL Script (Local)
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.DB_USER }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d master \
          -i database/init.sql \
          -C
 
      - name: Notify Teams - Local Deploy Success
        if: success()
        run: |
          MESSAGE="Local SQL deployment completed successfully in ${{ github.repository }}."
 
          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAM_WEBHOOK }}"
 
  # -----------------------
  # PARTNER DEPLOYMENT (APPROVAL REQUIRED)
  # -----------------------
  deploy-partner:
    runs-on: ubuntu-latest
 
    needs: deploy-local
 
    environment: production   # 🔥 THIS CREATES THE APPROVAL GATE
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
 
      - name: Execute SQL Script (Partner)
        env:
          SERVER: ${{ secrets.PARTNER_SQL_SERVER }}
          USERNAME: ${{ secrets.DB_USER }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d master \
          -i database/init.sql \
          -C
 
      - name: Notify Teams - Partner Deploy Success
        if: success()
        run: |
          MESSAGE="Partner SQL deployment completed successfully for ${{ github.repository }}."
 
          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAM_WEBHOOK }}"
 
      - name: Notify Teams - Failure
        if: failure()
        run: |
          MESSAGE="Partner SQL deployment FAILED for ${{ github.repository }}. Check logs."
 
          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAM_WEBHOOK }}"