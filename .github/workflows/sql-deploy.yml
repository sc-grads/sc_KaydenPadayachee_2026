name: Deploy Local SQL
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
env:
  DEPLOY_ENV: sql-deployment
 
jobs:
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send approval request to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "DEPLOYMENT APPROVAL REQUIRED",
            "text": "**A database deployment requires your approval**\n\n**Environment:** Local SQL Server\n**Requested by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n**Run:** ${{ github.run_id }}\n\n[Open Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Waiting for approval
        run: |
          echo "Approval request sent to Teams..."
          echo "Waiting for GitHub Environment approval gate..."
 
  deploy:
    needs: request-approval
    runs-on: ubuntu-latest
    environment: sql-deployment
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Send started notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL Deployment Started",
            "text": "**Environment:** Local SQL Server\n**Status:** Running\n**Run:** ${{ github.run_id }}",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
 
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          PORT: ${{ secrets.SQL_PORT }}
          USERNAME: ${{ secrets.DB_USER }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${SERVER},${PORT}" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "master" \
            -i Database/deploy.sql \
            -C
 
      - name: Send success notification to Teams
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "Deployment Successful",
            "text": "**SQL Server deployment completed successfully**\n\nRun: ${{ github.run_id }}",
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Send failure notification to Teams
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "Deployment Failed",
            "text": "**SQL deployment failed**\n\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}