name: Deploy SQL
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
env:
  DEPLOY_ENV: sql-deployment
 
jobs:
  request-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send approval request to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "DEPLOYMENT APPROVAL REQUIRED",
            "text": "**A database deployment requires approval**\n\n**Environment:** Local SQL Server\n**Database:** Cloud-tunnel-JP\n**Requested by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n**Time:** ${{ github.run_started_at }}\n\n[Review Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Wait for approval message
        run: |
          echo "Approval requested. Waiting for GitHub Environment approval..."
 
  deploy:
    needs: request-approval
    runs-on: ubuntu-latest
    environment: sql-deployment
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Send started notification to Teams
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL Deployment Started (Approved)",
            "text": "**Environment:** Local SQL Server\n**Database:** Cloud-tunnel-JP\n**Time:** ${{ github.run_started_at }}\n\n[View Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
 
      - name: Check secrets
        run: |
          [[ -n "${{ secrets.SQL_SERVER }}" ]] && echo "SQL_SERVER OK" || echo "SQL_SERVER MISSING"
          [[ -n "${{ secrets.DB_USER }}" ]] && echo "DB_USER OK" || echo "DB_USER MISSING"
          [[ -n "${{ secrets.DB_PASSWORD }}" ]] && echo "DB_PASSWORD OK" || echo "DB_PASSWORD MISSING"
 
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.DB_USER }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SERVER" \
            -U "$USERNAME" \
            -P "$PASSWORD" \
            -d "master" \
            -i database/init.sql \
            -C \
            -b
 
      - name: Send success notification to Teams
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"title\": \"Deployment Successful\",
            \"text\": \"Environment: Local SQL Server\nDatabase: Cloud-tunnel-KP\nTime: $(date -u)\",
            \"themeColor\": \"00FF00\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}
 
      - name: Send failure notification to Teams
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"title\": \"Deployment Failed\",
            \"text\": \"Environment: Local SQL Server\nCheck logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nTime: $(date -u)\",
            \"themeColor\": \"FF0000\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK}}