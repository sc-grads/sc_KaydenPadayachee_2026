name: Deploy Local + Partner SQL
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
 

  deploy-local:
    uses: ./.github/workflows/sql-deploy-template.yml
    environment: local-sql
    with:
      server: ${{ secrets.SQL_SERVER }}
      port: ${{ secrets.SQL_PORT }}
      database: Cloud-tunnel-KP
    secrets:
      username: ${{ secrets.DB_USER }}
      password: ${{ secrets.DB_PASSWORD }}
      webhook: ${{ secrets.TEAMS_WEBHOOK }}
 

  deploy-partner:
    needs: deploy-local
    uses: ./.github/workflows/sql-deploy-template.yml
    environment: partner-sql
    with:
      server: ${{ secrets.SQL_JP_SERVER }}
      port: ${{ secrets.SQL_PORT }}
      database: Cloud-tunnel-KP
    secrets:
      username: ${{ secrets.DB_USER }}
      password: ${{ secrets.SQL_JP_PASSWORD }}
      webhook: ${{ secrets.TEAMS_WEBHOOK }}