name: Deploy Local SQL
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
 
    #  THIS creates the approval gate
    environment: production
 
    steps:
      # STEP 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
 
      # STEP 2: Install SQLCMD
      - name: Install SQLCMD
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18
 
      # STEP 3: Debug secrets
      - name: Show secret status (debug)
        run: |
          if [[ -n "${{ secrets.SQL_SERVER }}" ]]; then
            echo "Secret SQL_SERVER is configured"
          else
            echo "WARNING: SQL_SERVER is missing"
          fi
 
      # STEP 4: Send Teams notification (approval required)
      - name: Send approval request to Teams
        shell: pwsh
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if (-not $env:TEAMS_WEBHOOK) {
            Write-Host "TEAMS_WEBHOOK is missing or empty"
            exit 1
          }
 
          $url = "https://github.com/$env:REPO/actions/runs/$env:RUN_ID"
 
          $body = @{
            text = " Approval required for SQL deployment`nRepo: $env:REPO`nTriggered by: $env:ACTOR`nApprove here: $url"
          } | ConvertTo-Json
 
          Invoke-RestMethod -Method Post `
            -Uri $env:TEAMS_WEBHOOK `
            -ContentType "application/json" `
            -Body $body
 
      #  GitHub will PAUSE here until approved
 
      # STEP 5: Execute SQL Script (runs ONLY after approval)
      - name: Execute SQL Script
        env:
          SERVER: ${{ secrets.SQL_SERVER }}
          USERNAME: ${{ secrets.DB_USER }}
          PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
          -S "$SERVER" \
          -U "$USERNAME" \
          -P "$PASSWORD" \
          -d "Cloud-tunnel-KP" \
          -i database/init.sql \
          -C \
          -l 30 
 
      # STEP 6: Notify success
      - name: Notify Teams - Success
        if: success()
        shell: pwsh
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          $body = @{
            text = " SQL deployment completed successfully."
          } | ConvertTo-Json
 
          Invoke-RestMethod -Method Post `
            -Uri $env:TEAMS_WEBHOOK `
            -ContentType "application/json" `
            -Body $body
 
      # STEP 7: Notify failure
      - name: Notify Teams - Failure
        if: failure()
        shell: pwsh
        env:
          TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        run: |
          $body = @{
            text = " SQL deployment FAILED. Check GitHub Actions logs."
          } | ConvertTo-Json
 
          Invoke-RestMethod -Method Post `
            -Uri $env:TEAMS_WEBHOOK `
            -ContentType "application/json" `
            -Body $body