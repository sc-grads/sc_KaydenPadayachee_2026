name: Deploy Local + Partner SQL
 
on:
  push:
    branches:
      - main
 
  workflow_dispatch:
 
jobs:
 
  deploy-local:
    uses: ./.github/workflows/reusable-sql-deploy.yml
 
    with:
      environment-name: local-sql
 
    secrets: inherit
 
  deploy-partner:
    needs: deploy-local
 
    uses: ./.github/workflows/reusable-sql-deploy.yml
 
    with:
      environment-name: partner-sql
 
    secrets: inherit
 
  notify-success:
    needs:
      - deploy-local
      - deploy-partner
 
    if: success()
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Send Success Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT SUCCESS",
            "text": "**Local and Partner deployments completed successfully**\nRun: ${{ github.run_id }}",
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
  notify-failure:
    needs:
      - deploy-local
      - deploy-partner
 
    if: failure()
 
    runs-on: ubuntu-latest
 
    steps:
      - name: Send Failure Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT FAILED",
            "text": "**One of the deployments failed**\n\nView logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }} 