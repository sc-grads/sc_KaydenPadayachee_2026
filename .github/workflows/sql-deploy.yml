name: DevTest Then Production
 
on:
  push:
    branches:
      - main
 
  workflow_dispatch:
 
jobs:
 
  DevTest:
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: local-sql
    secrets: inherit
 
  notify-production-approval:
    needs: DevTest
    runs-on: ubuntu-latest
    steps:
      - name: Send Production Approval Request
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "PRODUCTION SQL DEPLOYMENT APPROVAL REQUIRED",
            "text": "**DevTest deployment completed successfully.**\n\nProduction deployment is now awaiting approval.\n\n**Requested by:** ${{ github.actor }}\n**Branch:** ${{ github.ref_name }}\n**Run:** ${{ github.run_id }}\n\n[Open Workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})",
            "themeColor": "FFA500"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
  Production:
    needs: notify-production-approval
    uses: ./.github/workflows/reusable-sql-deploy.yml
    with:
      environment-name: partner-sql
    secrets: inherit
 
  notify-success:
    needs: [DevTest, Production]
    if: success()
    runs-on: ubuntu-latest
    steps:
      - name: Send Success Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT SUCCESS",
            "text": "**DevTest and Production deployments completed successfully**\nRun: ${{ github.run_id }}",
            "themeColor": "00FF00"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}
 
  notify-failure:
    needs: [DevTest, Production]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Send Failure Notification
        run: |
          curl -H "Content-Type: application/json" \
          -d '{
            "title": "SQL DEPLOYMENT FAILED",
            "text": "**One of the deployments failed**\n\nView logs:\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "themeColor": "FF0000"
          }' \
          ${{ secrets.TEAMS_WEBHOOK }}