name: Deploy SSIS via Pinggy Tunnel

on:
  push:
    branches:
      - main

jobs:
  # =========================================================================
  # JOB 1: DEPLOY TO LOCAL ENVIRONMENT (local-sql)
  # =========================================================================
  deploy-local:
    name: Tunnel Deployment to Local Laptop
    runs-on: windows-latest
    environment: local-sql

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS and Create Execution Job
      shell: powershell
      run: |
        $ispacPath = "${{ github.workspace }}\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
        if (-not (Test-Path -Path $ispacPath)) {
            $ispacPath = "${{ github.workspace }}\..\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate ProjectTime.ispac file."
            exit 1
        }
        
        $tunnelAddress = "${{ secrets.DB_SERVER }},${{ secrets.DB_PORT }}"
        $dbUser        = "${{ secrets.DB_USER }}"
        $dbPassword    = "${{ secrets.DB_PASSWORD }}"
        $initialDb     = "master"
        
        $targetFolder  = "ETL"
        $projectName   = "ProjectTime"
        $executionJobName = "Run_Timesheet_ETL_Job"
        
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
       
        Write-Host "Establishing local tunnel connection via automation_user..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=$initialDb;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
        try {
            $connection.Open()
            $sqlLines = @(
                "SET NOCOUNT ON;",
                "USE [msdb];",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'GitHub_SSIS_Deploy_Job')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'GitHub_SSIS_Deploy_Job', @enabled = 1, @start_step_id = 1, @owner_login_name = N'sa';",
                "DECLARE @deploy_script NVARCHAR(MAX);",
                "SET @deploy_script = N'USE [SSISDB]; IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = ''$targetFolder'') BEGIN EXEC [catalog].[create_folder] @folder_name = N''$targetFolder''; END DECLARE @project_stream VARBINARY(MAX) = $hexString; EXEC [catalog].[deploy_project] @folder_name = N''$targetFolder'', @project_name = N''$projectName'', @project_stream = @project_stream;';",
                "EXEC dbo.sp_add_jobstep @job_name = N'GitHub_SSIS_Deploy_Job', @step_name = N'Run Deploy', @subsystem = N'TSQL', @command = @deploy_script, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'GitHub_SSIS_Deploy_Job', @server_name = N'(local)';",
                "EXEC dbo.sp_start_job @job_name = N'GitHub_SSIS_Deploy_Job';",
                "WAITFOR DELAY '00:00:07';",
                "EXEC dbo.sp_delete_job @job_name = N'GitHub_SSIS_Deploy_Job';",
                "IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')",
                "BEGIN",
                "    EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;",
                "END",
                "EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Runs the automated timesheet SSIS project workflow completely hands-free.', @start_step_id = 1, @owner_login_name = N'automation_user';",
                "DECLARE @run_command NVARCHAR(MAX);",
                "SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\Package.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + N'DESKTOP-DBA1BPB\SQLSERVER2025' + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';",
                "EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute_SSIS_Timesheet_Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;",
                "EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';",
                "EXEC dbo.sp_add_jobschedule ",
                "    @job_name = N'$executionJobName', ",
                "    @name = N'Timesheet_One_Minute_Interval_Schedule', ",
                "    @enabled = 1, ",
                "    @freq_type = 8, ",
                "    @freq_interval = 62, ",
                "    @freq_subday_type = 4, ",
                "    @freq_subday_interval = 1, ",
                "    @freq_recurrence_factor = 1, ",
                "    @active_start_time = 080000, ",
                "    @active_end_time = 170000;"
            )
            $sqlQuery = $sqlLines -join "`n"
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.ExecuteNonQuery() | Out-Null
            Write-Host "SUCCESS: Local SSIS Project deployed successfully!"
        } catch {
            Write-Error "Local Deployment Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }

  # =========================================================================
  # JOB 2: DEPLOY TO PARTNER ENVIRONMENT (partner-sql)
  # =========================================================================
  deploy-partner:
    name: Tunnel Deployment to Partner Laptop
    runs-on: windows-latest
