name: Deploy SSIS via Pinggy Tunnel
 
on:
  push:
    branches:
      - main
 
jobs:
 
  # =========================================================================
  # JOB 1: DEVTEST DEPLOYMENT (LOCAL)
  # =========================================================================
  deploy-local:
    name: DevTest/Deploy
    runs-on: windows-latest
    environment: local-sql
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS directly to Local SSISDB
      shell: powershell
      run: |
        # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing alternate path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate ProjectTime.ispac file."
            exit 1
        }
        # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
        $tunnelAddress = "${{ secrets.DB_SERVER }},${{ secrets.DB_PORT }}"
        $dbUser        = "${{ secrets.DB_USER }}"
        $dbPassword    = "${{ secrets.DB_PASSWORD }}"
        $targetFolder     = "ETL"
        $projectName      = "ProjectTime"
        $executionJobName = "RunTimesheetDevTestMigrationPK"
        # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
        # STEP 4: INITIALIZE DIRECT SQL SERVER CONNECTION
        Write-Host "Establishing direct local database connection..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=SSISDB;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
 
        try {
            $connection.Open()
            $sqlQuery = @"
            SET NOCOUNT ON;
 
            -- 1. Ensure folder exists in the catalog
            IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = '$targetFolder') 
            BEGIN 
                EXEC [catalog].[create_folder] @folder_name = N'$targetFolder'; 
            END 
            -- 2. Deploy binary stream directly
            DECLARE @project_stream VARBINARY(MAX) = $hexString; 
            EXEC [catalog].[deploy_project] @folder_name = N'$targetFolder', @project_name = N'$projectName', @project_stream = @project_stream;
            -- 3. Configure Local SQL Agent Automation Job
            USE [msdb];
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetDevTestMigrationKPPK.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';
            EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';
            EXEC dbo.sp_add_jobschedule 
                @job_name = N'$executionJobName', 
                @name = N'Every_1_Minute_8AM_to_5PM', 
                @enabled = 1, 
                @freq_type = 4, 
                @freq_interval = 1, 
                @freq_subday_type = 4, 
                @freq_subday_interval = 1, 
                @active_start_time = 080000, 
                @active_end_time = 170000;
 
            EXEC dbo.sp_start_job @job_name = N'$executionJobName';
        "@
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.CommandTimeout = 300
            $command.ExecuteNonQuery() | Out-Null
 
            Write-Host "SUCCESS: Local SSIS Project deployed directly and scheduling job activated!"
 
        } catch {
            Write-Error "Local Direct Deployment Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }
 
  # =========================================================================
  # JOB 2: PRODUCTION DEPLOYMENT (PARTNER)
  # =========================================================================
  deploy-partner:
    name: Production/Deploy
    runs-on: windows-latest
    needs: deploy-local
    environment: partner-sql
 
    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4
 
    - name: Deploy SSIS directly to Partner SSISDB
      shell: powershell
      run: |
        # STEP 1: LOCATE THE SSIS DEPLOYMENT FILE
        $ispacPath = "${{ github.workspace }}\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Host "Primary path not found. Testing alternate path..."
            $ispacPath = "${{ github.workspace }}\..\Timesheet\ProjectTime\ProjectTime\bin\Development\ProjectTime.ispac"
            $ispacPath = [System.IO.Path]::GetFullPath($ispacPath)
        }
 
        if (-not (Test-Path -Path $ispacPath)) {
            Write-Error "CRITICAL ERROR: Could not locate ProjectTime.ispac file."
            exit 1
        }
 
        # STEP 2: DEFINE TARGET CONFIGURATIONS FROM YOUR ENVIRONMENT
        $tunnelAddress = "${{ secrets.DB_SERVER }},${{ secrets.DB_PORT }}"
        $dbUser        = "${{ secrets.DB_USER }}"
        $dbPassword    = "${{ secrets.DB_PASSWORD }}"
 
        $targetFolder     = "ETL"
        $projectName      = "ProjectTime"
        $executionJobName = "RunTimesheetProductionMigrationPK"
        # Partner specific configuration overrides
        $partnerServer    = "LAPTOP-7LSAQSR0"
 
        # STEP 3: CONVERT ISPAC FILE INTO BINARY DATA STREAM
        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexString = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")
 
        # STEP 4: INITIALIZE DIRECT SQL SERVER CONNECTION VIA TUNNEL
        Write-Host "Establishing direct tunnel connection to partner environment..."
        $connStr = "Data Source=$tunnelAddress;Initial Catalog=SSISDB;User ID=$dbUser;Password=$dbPassword;TrustServerCertificate=True;Encrypt=False;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connStr)
 
        try {
            $connection.Open()
 
            $sqlQuery = @"
            SET NOCOUNT ON;
 
            -- 1. Ensure folder exists in partner catalog
            IF NOT EXISTS (SELECT 1 FROM [catalog].[folders] WHERE name = '$targetFolder')
            BEGIN
                EXEC [catalog].[create_folder] @folder_name = N'$targetFolder';
            END
            -- 2. Deploy binary stream directly to partner catalog
            DECLARE @project_stream VARBINARY(MAX) = $hexString;
            EXEC [catalog].[deploy_project] @folder_name = N'$targetFolder', @project_name = N'$projectName', @project_stream = @project_stream;
 
            -- 3. Configure connection environment parameters 
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N'$targetFolder', @project_name = N'$projectName', @object_name = N'TimesheetDevTestMigrationKPPK.dtsx', @parameter_name = N'CM.DESKTOP-DBA1BPB\SQLSERVER2025.master1.ServerName', @parameter_value = N'$partnerServer';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N'$targetFolder', @project_name = N'$projectName', @object_name = N'TimesheetDevTestMigrationKPPK.dtsx', @parameter_name = N'CM.DESKTOP-DBA1BPB\SQLSERVER2025.TimesheetDB1.ServerName', @parameter_value = N'$partnerServer';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N'$targetFolder', @project_name = N'$projectName', @object_name = N'TimesheetDevTestMigrationKPPK.dtsx', @parameter_name = N'CM.DESKTOP-DBA1BPB\SQLSERVER2025.master1.InitialCatalog', @parameter_value = N'master';
            EXEC SSISDB.catalog.set_object_parameter_value @object_type = 30, @folder_name = N'$targetFolder', @project_name = N'$projectName', @object_name = N'TimesheetDevTestMigrationKPPK.dtsx', @parameter_name = N'CM.DESKTOP-DBA1BPB\SQLSERVER2025.TimesheetDB1.InitialCatalog', @parameter_value = N'TimesheetDB1';
 
            -- 4. Configure Partner SQL Agent Automation Job
            USE [msdb];
            IF EXISTS (SELECT job_id FROM msdb.dbo.sysjobs WHERE name = N'$executionJobName')
            BEGIN
                EXEC dbo.sp_delete_job @job_name = N'$executionJobName', @delete_unused_schedule=1;
            END
 
            EXEC dbo.sp_add_job @job_name = N'$executionJobName', @enabled = 1, @description = N'Automated execution tracking for $projectName.', @start_step_id = 1;
 
            DECLARE @TargetServer NVARCHAR(128) = CAST(SERVERPROPERTY('ServerName') AS NVARCHAR(128));
            DECLARE @run_command NVARCHAR(MAX);
            SET @run_command = N'/ISSERVER ' + CHAR(34) + N'\SSISDB\$targetFolder\$projectName\TimesheetDevTestMigrationKPPK.dtsx' + CHAR(34) + N' /SERVER ' + CHAR(34) + @TargetServer + CHAR(34) + N' /Par ' + CHAR(34) + N'`$ServerOption::LOGGING_LEVEL(Int16)' + CHAR(34) + N';1 /CALLERINFO SQLAGENT /REPORTING E';
 
            EXEC dbo.sp_add_jobstep @job_name = N'$executionJobName', @step_name = N'Execute SSIS Package', @subsystem = N'SSIS', @command = @run_command, @retry_attempts = 0;
            EXEC dbo.sp_add_jobserver @job_name = N'$executionJobName', @server_name = N'(local)';
            EXEC dbo.sp_add_jobschedule
                @job_name = N'$executionJobName',
                @name = N'Every_1_Minute_8AM_to_5PM',
                @enabled = 1,
                @freq_type = 4,
                @freq_interval = 1,
                @freq_subday_type = 4,
                @freq_subday_interval = 1,
                @active_start_time = 080000,
                @active_end_time = 170000;
 
            EXEC dbo.sp_start_job @job_name = N'$executionJobName';
        "@
 
            $command = $connection.CreateCommand()
            $command.CommandText = $sqlQuery
            $command.CommandTimeout = 300
            $command.ExecuteNonQuery() | Out-Null
 
            Write-Host "SUCCESS: Partner direct deployment completed and overrides applied!"
 
        } catch {
            Write-Error "Partner Direct Deployment Failed: $_"
            exit 1
        } finally {
            $connection.Close()
        }