name: GitHub-MS Teams Events Integration
 
on:
  push:
  pull_request:
    types: [opened, closed]
  create:
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
 
jobs:
  notify-teams:
    runs-on: ubuntu-latest
 
    steps:
      - name: Send message to MS Teams
        run: |
          EVENT_NAME="${{ github.event_name }}"
          EVENT_ACTION="${{ github.event.action }}"
 
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MESSAGE="**SQL DEPLOYMENT TRIGGERED** in **${{ github.repository }}** by **${{ github.actor }}**. Deployment pipeline started."
 
          elif [ "$EVENT_NAME" = "push" ]; then
            MESSAGE="**PUSH EVENT** in **${{ github.repository }}** by **${{ github.actor }}** | Commit: **${{ github.event.head_commit.message }}**"
 
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "opened" ]; then
            MESSAGE="**PULL REQUEST OPENED**: #${{ github.event.pull_request.number }} by **${{ github.actor }}** | Title: **${{ github.event.pull_request.title }}**"
 
          elif [ "$EVENT_NAME" = "pull_request_review" ]; then
            MESSAGE="**PULL REQUEST REVIEW**: #${{ github.event.pull_request.number }} | State: **${{ github.event.review.state }}** by **${{ github.actor }}**"
 
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "closed" ]; then
            MESSAGE="**PULL REQUEST MERGED**: #${{ github.event.pull_request.number }} into **main** by **${{ github.actor }}**"
 
          elif [ "$EVENT_NAME" = "create" ]; then
            MESSAGE="**BRANCH CREATED**: **${{ github.ref }}** in **${{ github.repository }}** by **${{ github.actor }}**"
 
          else
            MESSAGE="**EVENT OCCURRED** in **${{ github.repository }}** by **${{ github.actor }}**"
          fi
 
          curl -H "Content-Type: application/json" \
          -d "{\"text\": \"$MESSAGE\"}" \
          "${{ secrets.TEAM_WEBHOOK }}" 