name: End-to-End SSIS Package and Agent Job Deployment
 
on:
  push:
    branches:
      - main  # Triggers automation whenever code updates are pushed to main
 
jobs:
  deploy-all:
    runs-on: self-hosted  # Runs directly on your Windows Database Server via a self-hosted runner
    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4
 
    # -------------------------------------------------------------
    # STEP 1: DEPLOY COMPILED SSIS PACKAGE TO SSISDB
    # -------------------------------------------------------------
    - name: Deploy SSIS ISPAC Artifact to SSISDB Catalog
      run: |
        Write-Output "Checking for SQL Management Objects (SMO)..."
        # Force TLS 1.2/1.3 for module downloading
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12 -bor [Net.SecurityProtocolType]::Tls13
        # Ensure the modern SqlManagementObjects module is installed on the runner
        if (-not (Get-Module -ListAvailable -Name Microsoft.SqlServer.SqlManagementObjects)) {
            Write-Output "SMO not found. Installing via PowerShell Gallery..."
            Install-Module -Name Microsoft.SqlServer.SqlManagementObjects -Force -AllowClobber -Scope CurrentUser
        }
 
        Write-Output "Loading Integration Services Assemblies..."
        # Dynamically locate and load the assembly from the installed module path
        $smoPath = (Get-Module -ListAvailable -Name Microsoft.SqlServer.SqlManagementObjects)[0].ModuleBase
        $assemblyPath = Join-Path $smoPath "Microsoft.SqlServer.Management.IntegrationServices.dll"
        if (Test-Path $assemblyPath) {
            [System.Reflection.Assembly]::LoadFrom($assemblyPath) | Out-Null
        } else {
            # Fallback to standard loading if pathing varies
            Add-Type -AssemblyName "Microsoft.SqlServer.Management.IntegrationServices" -ErrorAction Stop
        }
        # Connection Variables
        $serverName = "DESKTOP-DBA1BPB\SQLSERVER2025"
        $connectionString = "Data Source=$serverName;Initial Catalog=master;Integrated Security=True;"
        $connection = New-Object System.Data.SqlClient.SqlConnection($connectionString)
        # Establish Connection to SSIS Management Namespace
        $integrationServices = New-Object Microsoft.SqlServer.Management.IntegrationServices.IntegrationServices($connection)
        # Target locations configuration
        $catalogName = "SSISDB"
        $folderName = "TimesheetAutomation"
        $projectName = "ProjectTime"
        $ispacPath = "$env:GITHUB_WORKSPACE\Timesheet\ProjectTime\bin\Development\ProjectTime.ispac"
 
        # Check if Catalog exists
        if ($integrationServices.Catalogs.Count -eq 0 -or !$integrationServices.Catalogs[$catalogName]) {
            Write-Error "SSISDB Catalog not found! Ensure SSIS feature is enabled on server instance: $serverName"
            exit 1
        }
 
        $catalog = $integrationServices.Catalogs[$catalogName]
 
        # Verify or Create deployment target directory folder
        $folder = $catalog.Folders[$folderName]
        if (!$folder) {
            Write-Output "Creating target environment folder: $folderName"
            $folder = New-Object Microsoft.SqlServer.Management.IntegrationServices.CatalogFolder($catalog, $folderName, "Automated deployment folder")
            $folder.Create()
        }
 
        # Deploy compiled project ISPAC binary stream
        Write-Output "Streaming ISPAC package deployment directly to SSISDB Catalog..."
        $projectBinary = [System.IO.File]::ReadAllBytes($ispacPath)
        $folder.DeployProject($projectName, $projectBinary)
        Write-Output "SSIS Project successfully registered to Catalog."
      shell: powershell